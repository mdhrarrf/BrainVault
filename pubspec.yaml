name: brainvault
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  google_generative_ai: ^0.4.7
  http: ^1.6.0
  image_picker: ^1.2.1
  provider: ^6.1.5+1
  supabase_flutter: ^2.12.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # SDK minimum untuk BrainVault
  adaptive_icon_background: "#6200EE" # Warna Deep Purple kita
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true